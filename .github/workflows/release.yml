# Builds the plugin when a version tag is pushed and publishes it as a GitHub pre-release: main.js,
# manifest.json and styles.css attached, with a build-provenance attestation, the shape BRAT installs
# from and Obsidian's directory reads (docs.obsidian.md, "Release your plugin with GitHub Actions").
# The tag must be on main and be the version in package.json, manifest.json and versions.json.
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: The tag is the version, and it is on main
        run: |
          node release-check.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release: $GITHUB_REF_NAME is not on main"
            exit 1
          }

      - name: Build and test
        # The corpus tests skip here (no Booklet repository or kit starters on the runner); the rest run.
        run: |
          npm ci
          npm run build
          npm test

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease --generate-notes \
            main.js manifest.json styles.css
